<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atom Download</title>
<style>
:root { --bg:#EDF1EE; --ink:#15201B; --muted:#56655E; --accent:#2E6B4F; --surface:#FFFFFF; --line:#CBD6CF; }
@media (prefers-color-scheme: dark) { :root { --bg:#0E1412; --ink:#E2E9E5; --muted:#93A29B; --accent:#5DB58A; --surface:#151D1A; --line:#2A3631; color-scheme: dark; } }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif; }
main { max-width:560px; margin:12vh auto 0; padding-inline:16px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:22px; }
h1 { font:700 26px/1.1 "Barlow Condensed","Arial Narrow",sans-serif; text-transform:uppercase; margin:0 0 8px; }
p { margin:0 0 10px; color:var(--muted); }
a.btn { display:inline-block; background:var(--accent); color:var(--surface); padding:9px 14px; border-radius:4px; text-decoration:none; font-weight:600; }
code { font-family:"IBM Plex Mono",Menlo,monospace; color:var(--ink); }
</style>
</head>
<body>
<main><div class="card">
  <h1 id="h">Preparing download…</h1>
  <p id="p"></p>
  <p><a class="btn" id="a" href="#" hidden>Download again</a></p>
  <p>Open the file in AtomStack Studio, check sizes and layer settings, run "Frame", then start. You can close this tab.</p>
</div></main>
<script>
// ?f=<name>.atom  -> serves files/<name>.atom
// #n=<name>&d=<base64url json> -> saves the embedded project (used for generated files)
(async () => {
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  let name, blob;
  try {
    if (h.get("d")) {
      name = (h.get("n") || "design").replace(/[^\w.-]+/g, "-") + ".atom";
      const b64 = h.get("d").replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
      blob = new Blob([Uint8Array.from(bin, c => c.charCodeAt(0))], { type: "application/octet-stream" });
    } else {
      const f = (q.get("f") || "").replace(/[^\w.-]+/g, "");
      if (!/\.atom$/.test(f)) throw new Error("No file named in the link.");
      const r = await fetch("files/" + f); if (!r.ok) throw new Error("File not found: " + f);
      name = f; blob = new Blob([await r.arrayBuffer()], { type: "application/octet-stream" });
    }
  } catch (e) { document.getElementById("h").textContent = "Couldn't prepare the file"; document.getElementById("p").textContent = e.message; return; }
  const a = document.getElementById("a"); a.href = URL.createObjectURL(blob); a.download = name; a.hidden = false;
  document.getElementById("h").textContent = "Downloading " + name;
  document.getElementById("p").innerHTML = "If nothing happened, use the button below.";
  a.click();
})();
</script>
</body>
</html>
